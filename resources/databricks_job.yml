resources:
  jobs:
    customer_pipeline:
      name: "[${bundle.target}] databricks-bc-customer-pipeline"

      tasks:
        - task_key: bronze_ingestion
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/notebooks/01_bronze_ingestion.sql
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: silver_transformation
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../src/notebooks/02_silver_transformation.sql
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: gold_customer_summary
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: silver_transformation
          notebook_task:
            notebook_path: ../src/notebooks/03_gold_customer_summary.sql
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: data_quality_checks
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: gold_customer_summary
          notebook_task:
            notebook_path: ../tests/test_customer_quality.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
